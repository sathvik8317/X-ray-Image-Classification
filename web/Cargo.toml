[package]
name = "xray-wasm"
version = "0.1.0"
edition = "2021"
description = "Chest X-ray classifier and CAM heatmap running in the browser (tract ONNX on wasm32)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tract-onnx = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = "0.4"
